<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rank Pulse</title>
<style>
  :root {
    --bg: #0f172a;
    --accent: #6366f1;
    --accent-2: #22d3ee;
    --text: #e2e8f0;
    --muted: #94a3b8;
  }

  html, body { margin: 0; height: 100%; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }

  iframe { border: 0; width: 100%; height: 100%; display: block; }

  #preloader {
    position: fixed;
    inset: 0;
    z-index: 9999;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 28px;
    background: radial-gradient(circle at 50% 30%, #1e293b 0%, var(--bg) 70%);
    color: var(--text);
    text-align: center;
    padding: 24px;
    box-sizing: border-box;
    transition: opacity 0.5s ease, visibility 0.5s ease;
  }

  #preloader.hidden {
    opacity: 0;
    visibility: hidden;
    pointer-events: none;
  }

  .rank-loader {
    position: relative;
    width: 84px;
    height: 84px;
  }

  .rank-loader::before,
  .rank-loader::after {
    content: "";
    position: absolute;
    inset: 0;
    border-radius: 50%;
    border: 4px solid transparent;
  }

  .rank-loader::before {
    border-top-color: var(--accent);
    border-right-color: var(--accent);
    animation: spin 1.1s linear infinite;
  }

  .rank-loader::after {
    inset: 14px;
    border-bottom-color: var(--accent-2);
    border-left-color: var(--accent-2);
    animation: spin-reverse 0.9s linear infinite;
  }

  @keyframes spin {
    to { transform: rotate(360deg); }
  }

  @keyframes spin-reverse {
    to { transform: rotate(-360deg); }
  }

  .brand {
    font-size: 20px;
    font-weight: 700;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    background: linear-gradient(90deg, var(--accent), var(--accent-2));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }

  .fact-box {
    max-width: 480px;
    min-height: 78px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .fact-label {
    font-size: 11px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--accent-2);
    margin-bottom: 8px;
    display: block;
  }

  #fact-text {
    font-size: 15px;
    line-height: 1.5;
    color: var(--muted);
    opacity: 0;
    transform: translateY(6px);
    transition: opacity 0.45s ease, transform 0.45s ease;
  }

  #fact-text.show {
    opacity: 1;
    transform: translateY(0);
  }

  .progress-dots {
    display: flex;
    gap: 6px;
  }

  .progress-dots span {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--accent-2);
    opacity: 0.3;
    animation: pulse 1.4s ease-in-out infinite;
  }

  .progress-dots span:nth-child(2) { animation-delay: 0.2s; }
  .progress-dots span:nth-child(3) { animation-delay: 0.4s; }

  @keyframes pulse {
    0%, 80%, 100% { opacity: 0.25; transform: scale(0.8); }
    40% { opacity: 1; transform: scale(1.15); }
  }

  @media (prefers-reduced-motion: reduce) {
    .rank-loader::before,
    .rank-loader::after,
    .progress-dots span {
      animation: none;
    }
  }
</style>
</head>
<body>

<div id="preloader">
  <div class="rank-loader" aria-hidden="true"></div>
  <div class="brand">Rank Pulse</div>
  <div class="fact-box">
    <div>
      <span class="fact-label">Did you know?</span>
      <div id="fact-text"></div>
    </div>
  </div>
  <div class="progress-dots" aria-hidden="true">
    <span></span><span></span><span></span>
  </div>
</div>

<iframe id="content-frame"
        src="https://script.google.com/macros/s/AKfycbworwXAJN8KL4TUiZrXPWntlX7Q0qJOs-8NvgJoCAhrMo4mR1ILj2n-fE-UbaJ9QF1T/exec"
        title="Rank Pulse" allow="clipboard-write"></iframe>

<script>
  var seoFacts = [
    "Google processes over 8.5 billion searches every single day.",
    "53% of all trackable website traffic comes from organic search.",
    "The #1 organic search result gets roughly 27% of all clicks.",
    "Page speed is a confirmed Google ranking factor for both desktop and mobile.",
    "Backlinks remain one of the top three ranking factors in Google's algorithm.",
    "Nearly 68% of online experiences begin with a search engine.",
    "Long-form content (1,500+ words) tends to earn more backlinks and shares.",
    "Mobile-friendliness has been a Google ranking signal since 2015.",
    "Featured snippets can boost click-through rate even above the #1 result.",
    "Voice search queries are often longer and more conversational than typed ones.",
    "Google uses hundreds of ranking signals to evaluate a single webpage.",
    "Sites with an SSL certificate (HTTPS) get a small ranking boost.",
    "Alt text on images helps both accessibility and image search rankings.",
    "The average first-page Google result contains around 1,400 words.",
    "Internal linking helps search engines discover and rank new pages faster.",
    "Core Web Vitals measure loading, interactivity, and visual stability.",
    "Fresh, regularly updated content is favored for many search queries.",
    "Meta descriptions don't directly affect rankings but strongly influence click-through rate.",
    "Over 50% of searches today happen on mobile devices.",
    "Structured data (schema markup) helps pages qualify for rich results."
  ];

  var factEl = document.getElementById("fact-text");
  var factIndex = -1;
  var factTimer = null;

  function showNextFact() {
    factIndex = (factIndex + 1) % seoFacts.length;
    factEl.classList.remove("show");
    setTimeout(function () {
      factEl.textContent = seoFacts[factIndex];
      factEl.classList.add("show");
    }, 250);
  }

  showNextFact();
  factTimer = setInterval(showNextFact, 3200);

  function hidePreloader() {
    var preloader = document.getElementById("preloader");
    if (!preloader) return;
    clearInterval(factTimer);
    preloader.classList.add("hidden");
    setTimeout(function () {
      preloader.remove();
    }, 600);
  }

  var frame = document.getElementById("content-frame");
  frame.addEventListener("load", hidePreloader);

  // Safety net in case the iframe's load event doesn't fire as expected.
  setTimeout(hidePreloader, 15000);
</script>

</body>
</html>
